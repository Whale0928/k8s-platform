# ArgoCD Application for Platform Infrastructure
# cert-manager, ingress-nginx, monitoring 통합 관리

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Whale0928/k8s-platform
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  ignoreDifferences:
    # ServiceAccount 토큰 Secret의 data는 클러스터가 채운다 - 매니페스트와 다른 것이 정상
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
