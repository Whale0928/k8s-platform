# ArgoCD command parameters
# BottleNote Application namespace 분리와 notification self-service 허용

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
  application.namespaces: bottlenote
  notificationscontroller.selfservice.enabled: "true"
