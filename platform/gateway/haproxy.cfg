global
    maxconn 4096
    zero-warning

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 5s

resolvers kubernetes
    parse-resolv-conf
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

frontend public-http
    bind :80
    default_backend envoy-http

frontend public-https
    bind :443
    default_backend envoy-https

backend envoy-http
    server envoy envoy-envoy-gateway-system-main-gateway-c3508b54.envoy-gateway-system.svc.cluster.local:80 send-proxy-v2 check check-send-proxy inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none

backend envoy-https
    server envoy envoy-envoy-gateway-system-main-gateway-c3508b54.envoy-gateway-system.svc.cluster.local:443 send-proxy-v2 check check-send-proxy inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none

# cheese-lake 개발 PostgreSQL 외부 노출 (development-postgresql.cheese-lake.com:5432)
# TLS는 PostgreSQL이 직접 처리한다(STARTTLS). haproxy는 TCP만 통과시킨다.
# production 데이터베이스는 pg_hba.conf에서 클러스터 대역으로만 제한된다.
frontend postgres-tcp
    bind :5432
    default_backend cheese-lake-postgres

backend cheese-lake-postgres
    server pg postgres.cheese-lake.svc.cluster.local:5432 check inter 5s fall 3 rise 2 resolvers kubernetes init-addr libc,none
