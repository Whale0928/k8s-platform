global
    maxconn 4096
    zero-warning

defaults
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout check 5s

resolvers kubernetes
    parse-resolv-conf
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

frontend public-http
    bind :80
    default_backend envoy-http

frontend public-https
    bind :443
    # SNI 기반 분기: warpgate.dead-whale.org만 Warpgate로, 나머지는 Envoy로.
    # TLS는 해독하지 않고 ClientHello의 SNI만 읽는다(passthrough).
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    use_backend warpgate-https if { req_ssl_sni -i warpgate.dead-whale.org }
    default_backend envoy-https

backend envoy-http
    server envoy envoy-envoy-gateway-system-main-gateway-c3508b54.envoy-gateway-system.svc.cluster.local:80 send-proxy-v2 check check-send-proxy inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none

backend envoy-https
    server envoy envoy-envoy-gateway-system-main-gateway-c3508b54.envoy-gateway-system.svc.cluster.local:443 send-proxy-v2 check check-send-proxy inter 2s fall 3 rise 2 resolvers kubernetes init-addr libc,none

# Warpgate bastion 라우팅
# 웹 UI(443 SNI 분기)와 PostgreSQL(5432), SSH(2222)를 Warpgate로 전달한다.
# DB 직결 노출은 제거됨 — 모든 접근은 Warpgate 인증 + 타겟 화이트리스트를 거친다.
# TLS는 Warpgate가 직접 종료한다. PROXY protocol v2로 실 클라이언트 IP를 전달한다
# (warpgate.yaml의 각 리스너 proxy_protocol: true와 반드시 함께 켜져야 한다).
backend warpgate-https
    server warpgate warpgate.warpgate.svc.cluster.local:8888 send-proxy-v2 check check-send-proxy inter 5s fall 3 rise 2 resolvers kubernetes init-addr libc,none

frontend postgres-tcp
    bind :5432
    default_backend warpgate-postgres

backend warpgate-postgres
    server warpgate warpgate.warpgate.svc.cluster.local:55432 send-proxy-v2 check check-send-proxy inter 5s fall 3 rise 2 resolvers kubernetes init-addr libc,none

frontend ssh-tcp
    bind :2222
    default_backend warpgate-ssh

backend warpgate-ssh
    server warpgate warpgate.warpgate.svc.cluster.local:2222 send-proxy-v2 check check-send-proxy inter 5s fall 3 rise 2 resolvers kubernetes init-addr libc,none
