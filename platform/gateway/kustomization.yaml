apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Envoy Gateway v1.9.3 (Gateway API CRDs 포함)
  - https://github.com/envoyproxy/gateway/releases/download/v1.9.3/install.yaml
  # v1.3.3 공식 정의를 보존해 기존 CRD의 prune을 막는다.
  - legacy backend lb policy.json
  # v1.7.5 공식 정의를 보존해 기존 XListenerSet CRD를 유지한다.
  - legacy x listener set.json
  # Custom resources
  - client-traffic-policy.yaml
  - envoyproxy.yaml
  - haproxy-daemonset.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - certificate.yaml

configMapGenerator:
  - name: edge-haproxy-config
    namespace: envoy-gateway-system
    files:
      - haproxy.cfg
      - blocked_ips.lst

patches:
  # 기존 legacy CRD는 정의와 버전이 같은 UPDATE만 허용한다.
  # JSON test가 upstream 검증식 변경을 감지하므로 path 파일 그대로 사용한다.
  - target:
      group: admissionregistration.k8s.io
      version: v1
      kind: ValidatingAdmissionPolicy
      name: safe-upgrades.gateway.networking.k8s.io
    path: safe upgrades legacy patch.json
  # Envoy Gateway 컨트롤러 → arm64 노드 배치
  - target:
      kind: Deployment
      name: envoy-gateway
      namespace: envoy-gateway-system
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
  # 도메인별 Gateway 리스너 (주석 처리로 개별 제어 가능)
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/cheese-lake.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/dead-whale.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/kr-filter.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/profanity-kr-filter.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/bottle-note.yaml
