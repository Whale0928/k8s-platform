apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Envoy Gateway v1.2.6 (Gateway API CRDs 포함)
  - https://github.com/envoyproxy/gateway/releases/download/v1.2.6/install.yaml
  # Custom resources
  - envoyproxy.yaml
  - gatewayclass.yaml
  - gateway.yaml
  - certificate.yaml

patches:
  # Envoy Gateway 컨트롤러 → arm64 노드 배치
  - target:
      kind: Deployment
      name: envoy-gateway
      namespace: envoy-gateway-system
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
  # 도메인별 Gateway 리스너 (주석 처리로 개별 제어 가능)
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/dead-whale.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/kr-filter.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/profanity-kr-filter.yaml
  - target:
      kind: Gateway
      name: main-gateway
      namespace: envoy-gateway-system
    path: patches/bottle-note.yaml
