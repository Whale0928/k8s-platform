# *.cheese-lake.com 리스너
- op: add
  path: /spec/listeners/-
  value:
    name: https-cheese-lake
    protocol: HTTPS
    port: 443
    hostname: "*.cheese-lake.com"
    tls:
      mode: Terminate
      certificateRefs:
        - group: ""
          kind: Secret
          name: wildcard-cheese-lake-tls
    allowedRoutes:
      namespaces:
        from: All
