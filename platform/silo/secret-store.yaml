# 기존 home-lab 읽기 전용 Connect 토큰을 사용한다.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-store
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets-system.svc.cluster.local:8080
      vaults:
        home-lab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: op-token
            key: token
