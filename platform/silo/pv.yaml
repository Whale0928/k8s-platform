# pve-pod-1에 새로 연결하는 500GiB 디스크 → /mnt/objdata
# claimRef와 nodeAffinity로 다른 PVC나 노드에 연결되지 않게 한다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: silo-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-disk
  local:
    path: /mnt/objdata
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: silo
    name: data-silo-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pve-pod-1
