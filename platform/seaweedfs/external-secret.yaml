apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: home-lab
  target:
    name: seaweedfs-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        admin-user: '{{ .adminUser }}'
        admin-password: '{{ .adminPassword }}'
        s3.json: >-
          {{ dict "identities" (list
          (dict "name" "default-bucket" "credentials" (list (dict "accessKey" .defaultAccessKey "secretKey" .defaultSecretKey)) "actions" (list "Read:default" "Write:default" "List:default" "Tagging:default"))
          (dict "name" "cheese-lake-clickhouse" "credentials" (list (dict "accessKey" .clickhouseAccessKey "secretKey" .clickhouseSecretKey)) "actions" (list "Read:cheese-lake-clickhouse" "Write:cheese-lake-clickhouse" "List:cheese-lake-clickhouse"))) | toJson }}
  data:
    - secretKey: adminUser
      remoteRef:
        key: SeaweedFS Admin
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: adminPassword
      remoteRef:
        key: SeaweedFS Admin
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: defaultAccessKey
      remoteRef:
        key: SeaweedFS Admin
        property: accessKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: defaultSecretKey
      remoteRef:
        key: SeaweedFS Admin
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: clickhouseAccessKey
      sourceRef:
        storeRef:
          name: cheese-lake
          kind: SecretStore
      remoteRef:
        key: SeaweedFS ClickHouse
        property: accessKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: clickhouseSecretKey
      sourceRef:
        storeRef:
          name: cheese-lake
          kind: SecretStore
      remoteRef:
        key: SeaweedFS ClickHouse
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
