# Warpgate 본체
# - initContainer: 최초 기동 시 unattended-setup으로 /data/warpgate.yaml 생성,
#   매 기동 시 cert-manager 인증서를 /data로 복사(자체 서명 인증서 덮어쓰기)
# - SQLite 사용이므로 replicas는 반드시 1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warpgate
  namespace: warpgate
  labels:
    app.kubernetes.io/name: warpgate
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: warpgate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warpgate
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: setup
          image: ghcr.io/warp-tech/warpgate:0.28.2
          imagePullPolicy: IfNotPresent
          env:
            - name: WARPGATE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warpgate-admin
                  key: adminPassword
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ ! -f /data/warpgate.yaml ]; then
                warpgate -c /data/warpgate.yaml unattended-setup --data-path /data \
                  --http-port 8888 --ssh-port 2222 --postgres-port 55432 --record-sessions
                # IPv4 전용 Pod 네트워크: [::] 바인딩을 0.0.0.0으로 교체
                sed -i 's/\[::\]:\([0-9]\+\)/0.0.0.0:\1/g' /data/warpgate.yaml
              fi
              # cert-manager 인증서를 매 기동 시 복사 (갱신 반영은 파드 재시작으로)
              cp /tls-cert/tls.crt /data/tls.certificate.pem
              cp /tls-cert/tls.key /data/tls.key.pem
              chmod 600 /data/tls.certificate.pem /data/tls.key.pem
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls-cert
              mountPath: /tls-cert
              readOnly: true
      containers:
        - name: warpgate
          image: ghcr.io/warp-tech/warpgate:0.28.2
          imagePullPolicy: IfNotPresent
          command:
            - warpgate
            - -c
            - /data/warpgate.yaml
            - run
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
            - name: pgsql
              containerPort: 55432
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: warpgate-data
        - name: tls-cert
          secret:
            secretName: warpgate-tls
