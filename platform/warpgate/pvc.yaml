# Warpgate 상태 저장소 (/data: warpgate.yaml, SQLite DB, 세션 기록)
# local-path라서 최초 바인딩된 노드에 파드가 고정된다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: warpgate-data
  namespace: warpgate
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
