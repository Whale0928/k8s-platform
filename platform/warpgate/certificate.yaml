# warpgate.dead-whale.org 인증서 (DNS-01, Cloudflare)
# Warpgate가 웹 UI(8888)와 PostgreSQL 리스너(55432) TLS에 직접 사용한다.
# cert-manager 갱신 후에는 파드 재시작이 필요하다(시작 시 /data로 복사하는 구조).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: warpgate-tls
  namespace: warpgate
spec:
  secretName: warpgate-tls
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer
  dnsNames:
    - "warpgate.dead-whale.org"
