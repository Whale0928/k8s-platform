# 1Password home-lab 볼트의 warpgate-admin 아이템 → warpgate-admin Secret
# unattended-setup이 admin 계정 초기 비밀번호로 사용한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warpgate-admin
  namespace: warpgate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: onepassword-store
  target:
    name: warpgate-admin
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: adminPassword
      remoteRef:
        key: warpgate-admin
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
