# Redis Operator RBAC

---
apiVersion: v1
kind: Namespace
metadata:
  name: redis-operator
  labels:
    control-plane: redis-operator

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-operator
  labels:
    control-plane: redis-operator

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: redis-operator-manager-role
rules:
  # Core resources
  - apiGroups: [""]
    resources:
      - configmaps
      - events
      - namespaces
      - persistentvolumeclaims
      - pods
      - pods/exec
      - secrets
      - services
    verbs: [create, delete, get, list, patch, update, watch]
  # CRD discovery
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # StatefulSet management
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  # Leader election
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
  # PodDisruptionBudget
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [create, delete, get, list, patch, update, watch]
  # Redis CRDs
  - apiGroups: [redis.redis.opstreelabs.in]
    resources:
      - redis
      - redisclusters
      - redisreplications
      - redissentinels
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources:
      - "*/finalizers"
    verbs: [update]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources:
      - "*/status"
    verbs: [get, patch, update]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redis-operator-manager-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: redis-operator-manager-role
subjects:
  - kind: ServiceAccount
    name: redis-operator
    namespace: redis-operator

---
# Leader Election (namespace-scoped)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redis-operator-leader-election
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-operator-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redis-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: redis-operator
    namespace: redis-operator
