# pve-pod-1의 500GiB 디스크를 SeaweedFS 전용 PVC에 연결한다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: seaweedfs-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-disk
  local:
    path: /mnt/objdata
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: seaweedfs
    name: data-seaweedfs-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pve-pod-1
