# SeaweedFS 전환을 위해 보존한 500GiB 디스크 → /mnt/objdata
# Silo PVC 삭제 후 Released 상태로 보존한다. 새 배포의 PVC 계약을 확정한 뒤
# 기존 claimRef를 명시적으로 교체하여 다른 PVC에 자동 연결되지 않게 한다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: silo-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-disk
  local:
    path: /mnt/objdata
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    namespace: silo
    name: data-silo-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - pve-pod-1
