# nonk8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # cert-manager v1.19.6 (Gateway API 지원, Cloudflare DNS-01 cleanup 버그 fix 포함)
  - https://github.com/cert-manager/cert-manager/releases/download/v1.19.6/cert-manager.yaml
  # ClusterIssuers
  - dns-issuer.yaml           # DNS-01 (Cloudflare + Route53)

generators:
  - ksops-generator.yaml

patches:
  # Gateway API feature gate 활성화
  - target:
      kind: Deployment
      name: cert-manager
      namespace: cert-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=ExperimentalGatewayAPISupport=true
      # 기존 발급 이력을 업그레이드 과정에서 삭제하지 않는다.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --controllers=*,-certificates-revision-manager
