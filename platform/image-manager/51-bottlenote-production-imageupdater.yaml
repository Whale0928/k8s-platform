apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: bottlenote-production-updater
  namespace: argocd
spec:
  namespace: bottlenote

  writeBackConfig:
    method: "git"
    gitConfig:
      repository: "https://github.com/bottle-note/environment-variables"
      branch: "main"
      writeBackTarget: "kustomization"

  applicationRefs:
    - namePattern: "bottlenote-production"
      images:
        # 운영 백엔드는 통합 api 하나다. product-api·admin-api 이미지는 더 발행하지 않는다.
        - alias: "api"
          imageName: "docker-registry.bottle-note.com/bottlenote-api:api_latest_production"
          commonUpdateSettings:
            updateStrategy: "digest"
            allowTags: "regexp:^api_latest_production$"
            platforms:
              - "linux/arm64"
          manifestTargets:
            kustomize:
              name: "bottlenote-api"

        - alias: "frontend"
          imageName: "docker-registry.bottle-note.com/bottlenote-frontend:frontend_latest_production"
          commonUpdateSettings:
            updateStrategy: "digest"
            allowTags: "regexp:^frontend_latest_production$"
            platforms:
              - "linux/arm64"
          manifestTargets:
            kustomize:
              name: "bottlenote-frontend"

        - alias: "admin-dashboard"
          imageName: "docker-registry.bottle-note.com/bottlenote-admin-dashboard:dashboard_latest_production"
          commonUpdateSettings:
            updateStrategy: "digest"
            allowTags: "regexp:^dashboard_latest_production$"
            platforms:
              - "linux/arm64"
          manifestTargets:
            kustomize:
              name: "bottlenote-admin-dashboard"
