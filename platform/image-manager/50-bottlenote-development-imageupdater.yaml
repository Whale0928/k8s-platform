apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: bottlenote-development-updater
  namespace: argocd
spec:
  namespace: bottlenote

  writeBackConfig:
    method: "git"
    gitConfig:
      repository: "https://github.com/bottle-note/environment-variables"
      branch: "main"
      writeBackTarget: "kustomization"

  applicationRefs:
    - namePattern: "bottlenote-development"
      images:
        # 통합 API: 개발 overlay가 처음부터 이 이미지 이름으로 배포하므로 forceUpdate가 필요 없다
        - alias: "api"
          imageName: "docker-registry.bottle-note.com/bottlenote-api:api_latest_development"
          commonUpdateSettings:
            updateStrategy: "digest"
            allowTags: "regexp:^api_latest_development$"
            platforms:
              - "linux/arm64"
          manifestTargets:
            kustomize:
              name: "bottlenote-api"

        - alias: "frontend"
          imageName: "docker-registry.bottle-note.com/bottlenote-frontend:frontend_latest_development"
          commonUpdateSettings:
            updateStrategy: "digest"
            allowTags: "regexp:^frontend_latest_development$"
            platforms:
              - "linux/arm64"
          manifestTargets:
            kustomize:
              name: "bottlenote-frontend"

        - alias: "admin-dashboard"
          imageName: "docker-registry.bottle-note.com/bottlenote-admin-dashboard:dashboard_latest_development"
          commonUpdateSettings:
            updateStrategy: "digest"
            allowTags: "regexp:^dashboard_latest_development$"
            platforms:
              - "linux/arm64"
          manifestTargets:
            kustomize:
              name: "bottlenote-admin-dashboard"
