apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cheese-lake
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.external-secrets-system.svc.cluster.local:8080
      vaults:
        cheese-lake: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: seaweedfs-op-token
            key: token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: cheese-lake
  target:
    name: seaweedfs-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: access-key
      remoteRef:
        key: SeaweedFS ClickHouse
        property: accessKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secret-key
      remoteRef:
        key: SeaweedFS ClickHouse
        property: secretKey
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
