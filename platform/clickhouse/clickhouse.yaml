# 공유 ClickHouse
# 프로젝트별 격리는 인스턴스 분리가 아니라 database 분리로 한다.
# database와 계정 생성은 default 계정으로 수동 수행한다 (postgres와 동일).
# 외부 노출은 하지 않는다 - 외부 접속 경로는 Warpgate가 담당한다.
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
    # Warpgate가 붙는 포트. PostgreSQL wire protocol 호환
    - name: postgresql
      port: 9005
      targetPort: 9005
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # 전용 디스크(/mnt/chdata)가 이 노드에 있으므로 고정한다
      nodeSelector:
        kubernetes.io/hostname: pve-pod-2
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.7.3.19-alpine
          env:
            - name: TZ
              value: Asia/Seoul
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-root
                  key: CLICKHOUSE_PASSWORD
            # default 계정에 SQL로 사용자/권한을 관리할 권한을 준다.
            # 없으면 CREATE USER가 ACCESS_DENIED로 막혀 프로젝트 계정을 만들 수 없다.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
            - name: postgresql
              containerPort: 9005
          volumeMounts:
            - name: config
              mountPath: /etc/clickhouse-server/config.d/local.xml
              subPath: local.xml
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/users.d/local.xml
              subPath: users.xml
              readOnly: true
            - name: data
              mountPath: /var/lib/clickhouse
          # /ping은 인증을 요구하지 않는다. clickhouse-client 방식은
          # default 계정에 비밀번호가 걸리면 프로브가 함께 실패한다.
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            # request를 낮게 두면 노드 메모리 압박 시 가장 먼저 축출된다.
            # 분석 워크로드 특성상 실사용이 request를 크게 넘으므로 올려둔다.
            requests:
              cpu: 250m
              memory: 2Gi
            # 노드 11.7GB 중 다른 파드 실사용이 낮아 8Gi까지 여유가 있다.
            # 서버는 ratio 0.7이 적용되어 실제로는 약 5.6GB까지 쓴다.
            limits:
              cpu: "4"
              memory: 8Gi
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # 전용 디스크(/mnt/chdata, pve-pod-2 /dev/sdc)
        storageClassName: local-disk
        resources:
          requests:
            storage: 100Gi
