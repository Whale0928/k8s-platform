# 공유 ClickHouse
# 프로젝트별 격리는 인스턴스 분리가 아니라 database 분리로 한다.
# database와 계정 생성은 default 계정으로 수동 수행한다 (postgres와 동일).
# 외부 노출은 하지 않는다 - 외부 접속 경로는 Warpgate가 담당한다.
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
    # Warpgate가 붙는 포트. PostgreSQL wire protocol 호환
    - name: postgresql
      port: 9005
      targetPort: 9005
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # 전용 디스크(/mnt/chdata)가 이 노드에 있으므로 고정한다
      nodeSelector:
        kubernetes.io/hostname: pve-pod-2
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.7.3.19-alpine
          env:
            - name: TZ
              value: Asia/Seoul
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-root
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
            - name: postgresql
              containerPort: 9005
          volumeMounts:
            - name: config
              mountPath: /etc/clickhouse-server/config.d/local.xml
              subPath: local.xml
              readOnly: true
            - name: data
              mountPath: /var/lib/clickhouse
          # /ping은 인증을 요구하지 않는다. clickhouse-client 방식은
          # default 계정에 비밀번호가 걸리면 프로브가 함께 실패한다.
          readinessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8123
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # 전용 디스크(/mnt/chdata, pve-pod-2 /dev/sdc)
        storageClassName: local-disk
        resources:
          requests:
            storage: 100Gi
