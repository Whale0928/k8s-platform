# ClickHouse 서버 설정 (config.d에 병합)
#
# [핵심] postgresql_port 9005
# Warpgate는 ClickHouse native 프로토콜(9000)을 프록시하지 못한다.
# PostgreSQL wire protocol 호환 포트를 열어 Warpgate의 기존 postgres
# 리스너(외부 5432)를 그대로 재사용한다. 새 포트도 방화벽 변경도 필요 없다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: clickhouse
data:
  local.xml: |
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>

        <!-- Warpgate 연결의 전제. 이 포트가 없으면 외부 접속 경로가 없다 -->
        <postgresql_port>9005</postgresql_port>

        <!-- 컨테이너 limit(4Gi) 기준으로 서버가 쓸 상한 -->
        <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
        <mark_cache_size>268435456</mark_cache_size>

        <!-- postgres가 Asia/Seoul이라 맞춘다. 어긋나면 시각 비교가 헷갈린다 -->
        <timezone>Asia/Seoul</timezone>

        <logger>
            <level>warning</level>
        </logger>

        <!-- ClickHouse 가 스스로 남기는 내부 로그 표(system.*_log)의 보존 기간.
             기본은 기한 없음이라 기동 12일 만에 2.3 GB — 우리 데이터(2.6 GB)와
             맞먹는 크기 — 가 쌓였다 (2026.09.02 실측: trace_log 725 MB ·
             metric_log 544 · part_log 418 · processors_profile_log 222 ·
             query_log 190 · asynchronous_metric_log 179).
             운영 진단에는 며칠치면 충분하다. 프로파일러 계열(trace · processors
             profile)은 진단할 때만 켜면 되므로 끈다 — remove 는 표를 만들지 않게
             한다. TTL 은 재기동 때 표에 적용되므로 바꾸면 파드를 다시 띄워야 한다. -->
        <query_log>
            <ttl>event_date + INTERVAL 14 DAY DELETE</ttl>
        </query_log>
        <part_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </part_log>
        <metric_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </metric_log>
        <asynchronous_metric_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </asynchronous_metric_log>
        <query_metric_log>
            <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </query_metric_log>
        <error_log>
            <ttl>event_date + INTERVAL 14 DAY DELETE</ttl>
        </error_log>
        <trace_log remove="1"/>
        <processors_profile_log remove="1"/>
        <query_thread_log remove="1"/>
    </clickhouse>
  # 쿼리 단위 자원 제한 (users.d에 병합)
  #
  # [핵심] external_group_by/sort가 0이면 메모리 초과 시 쿼리가 "실패"한다.
  # 값을 주면 디스크로 흘려보내고 "느려지지만 완주"한다. 데이터가 자라면서
  # 예고 없이 실패하는 것을 막는 장치다.
  users.xml: |
    <clickhouse>
        <profiles>
            <default>
                <!-- 쿼리 하나가 서버 전체를 먹지 못하게 하는 상한 -->
                <max_memory_usage>4294967296</max_memory_usage>
                <!-- 이 값을 넘으면 디스크로 흘려보낸다 (상한의 절반) -->
                <max_bytes_before_external_group_by>2147483648</max_bytes_before_external_group_by>
                <max_bytes_before_external_sort>2147483648</max_bytes_before_external_sort>
            </default>
        </profiles>
    </clickhouse>
