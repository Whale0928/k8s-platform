# ClickHouse 서버 설정 (config.d에 병합)
#
# [핵심] postgresql_port 9005
# Warpgate는 ClickHouse native 프로토콜(9000)을 프록시하지 못한다.
# PostgreSQL wire protocol 호환 포트를 열어 Warpgate의 기존 postgres
# 리스너(외부 5432)를 그대로 재사용한다. 새 포트도 방화벽 변경도 필요 없다.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: clickhouse
data:
  local.xml: |
    <clickhouse>
        <listen_host>0.0.0.0</listen_host>

        <!-- Warpgate 연결의 전제. 이 포트가 없으면 외부 접속 경로가 없다 -->
        <postgresql_port>9005</postgresql_port>

        <!-- 컨테이너 limit(4Gi) 기준으로 서버가 쓸 상한 -->
        <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
        <mark_cache_size>268435456</mark_cache_size>

        <!-- postgres가 Asia/Seoul이라 맞춘다. 어긋나면 시각 비교가 헷갈린다 -->
        <timezone>Asia/Seoul</timezone>

        <logger>
            <level>warning</level>
        </logger>
    </clickhouse>
