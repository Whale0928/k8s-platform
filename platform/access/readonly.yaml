# 외부 에이전트(디스코드 봇) 조회 전용 계정
#
# 허용: get/list/watch 만
# 제외: secrets(자격증명 노출 방지), roles류(권한 상승 경로 차단), pods/exec, 모든 쓰기
# 봇 추가 시: 아래 ServiceAccount/ClusterRoleBinding/Secret 3개만 이름 바꿔 복사한다

---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-access

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - namespaces
      - nodes
      - events
      - configmaps
      - persistentvolumeclaims
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways, httproutes]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: [applications, appprojects]
    verbs: [get, list, watch]
  - apiGroups: [redis.redis.opstreelabs.in]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]

# -- 헤르메스 봇 --
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes
  namespace: agent-access
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-readonly
subjects:
  - kind: ServiceAccount
    name: hermes
    namespace: agent-access

# 만료 없는 토큰 - data는 클러스터가 채운다(Git에 비밀값 없음)
# 회수: 이 Secret을 지우면 즉시 무효화된다
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-token
  namespace: agent-access
  annotations:
    kubernetes.io/service-account.name: hermes
type: kubernetes.io/service-account-token
